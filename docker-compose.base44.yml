services:
  web:
    image: node:22-alpine
    working_dir: /app
    command:
      [
        'sh',
        '-ec',
        'npm install --no-audit --no-fund && exec npm run dev -- --host 0.0.0.0 --port 5173',
      ]
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - '3000:5173'
    environment:
      - BASE44_PREVIEW_MODE
      - BASE44_SANDBOX_HOST_DOMAIN
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -qO- http://127.0.0.1:5173/ >/dev/null 2>&1 || exit 1',
        ]
      interval: 15s
      timeout: 4s
      retries: 4
      start_period: 90s
    labels:
      base44.project: velora
      base44.kind: web
      base44.port: '3000'
    restart: on-failure

volumes:
  node_modules:
