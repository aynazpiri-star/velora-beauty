name: velora

services:
  api:
    image: node:22
    working_dir: /app
    restart: on-failure
    volumes:
      - .:/app
    environment:
      - NODE_ENV=development
      - PORT=8000
      - DATA_DIR=/app/.data
    command: ["sh", "-ec", "npm install --no-audit --no-fund && exec node server/index.js"]
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:8000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 150s

  web:
    image: node:22
    working_dir: /app
    restart: on-failure
    # The API installs dependencies first (its healthcheck gates this service), so the two
    # services never run npm against the shared bind-mounted node_modules at the same time.
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - .:/app
    environment:
      - BASE44_PREVIEW_MODE
      - BASE44_SANDBOX_HOST_DOMAIN
      - BASE44_PUBLIC_HOST_SUFFIX
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - API_URL=http://api:8000
    command: ["sh", "-ec", "npm install --no-audit --no-fund && exec npm run dev"]
    ports:
      - "3000:3000"
    labels:
      base44.project: "Velora"
      base44.kind: "web"
      base44.port: "3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s
