services:
  web:
    image: node:22
    working_dir: /app
    command:
      - sh
      - -ec
      - npm install --no-audit --no-fund && exec npm run dev
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
      # Bind-mounted files: make the dev server watch them reliably.
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      # Consumed by next.config.mjs (allowedDevOrigins) only when BOTH are set.
      - BASE44_PREVIEW_MODE
      - BASE44_PUBLIC_HOST_SUFFIX
    volumes:
      - .:/app
      - velora_node_modules:/app/node_modules
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 120s
    restart: on-failure
    labels:
      - base44.project=Velora
      - base44.kind=web
      - base44.port=3000

volumes:
  velora_node_modules:
