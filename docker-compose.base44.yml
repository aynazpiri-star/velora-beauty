services:
  web:
    image: node:22
    working_dir: /app
    command:
      [
        "sh",
        "-ec",
        "if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi && exec npm run dev",
      ]
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:3000"
    environment:
      - CI=true
      - CHOKIDAR_USEPOLLING=true
      - BASE44_PREVIEW_MODE
    restart: on-failure
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    labels:
      base44.project: "AURELIA Jewelry"
      base44.kind: "web"
      base44.port: "3000"

volumes:
  node_modules:
